<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>AthenXiv — brand marks</title>
<style>
  :root { color-scheme: light dark; --ink:#111; --muted:#6b7280; --line:#d7dbe0; }
  * { box-sizing: border-box; }
  body { margin:0; padding:32px; font:15px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; background:#f6f7f9; color:var(--ink); }
  h1 { font-size:20px; margin:0 0 4px; }
  p.sub { margin:0 0 28px; color:var(--muted); }
  .grid { display:grid; gap:24px; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr)); }
  .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:18px; }
  .card header { display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:14px; }
  .card h2 { font-size:15px; margin:0; }
  .card code { font-size:11px; color:var(--muted); }
  .surfaces { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .surface { display:flex; align-items:center; justify-content:center; border-radius:10px; padding:16px; min-height:150px; }
  .surface.light { background:#fff; border:1px solid var(--line); }
  .surface.dark { background:#0b0f16; }
  .surface img { max-width:100%; max-height:150px; }
  .strip { display:flex; align-items:flex-end; gap:18px; margin-top:14px; padding-top:12px; border-top:1px dashed var(--line); }
  .strip figure { margin:0; text-align:center; color:var(--muted); }
  .strip figcaption { font-size:10px; margin-top:4px; }
</style>
<h1>AthenXiv — brand marks</h1>
<p class="sub">5 asset(s) — light surface, dark surface, and 64/32/16 px legibility.</p>
<div class="grid">

    <section class="card">
      <header><h2>1-mark-512</h2><code>1-mark-512.png</code></header>
      <div class="surfaces">
        <div class="surface light"><img src="preview-src/1-mark-512.png" alt="1-mark-512 on light"></div>
        <div class="surface dark"><img src="preview-src/1-mark-512.png" alt="1-mark-512 on dark"></div>
      </div>
      <div class="strip">
        <figure><img src="preview-src/1-mark-512.png" width="64" height="64" alt=""><figcaption>64</figcaption></figure>
        <figure><img src="preview-src/1-mark-512.png" width="32" height="32" alt=""><figcaption>32</figcaption></figure>
        <figure><img src="preview-src/1-mark-512.png" width="16" height="16" alt=""><figcaption>16</figcaption></figure>
      </div>
    </section>

    <section class="card">
      <header><h2>2-alt-column-512</h2><code>2-alt-column-512.png</code></header>

        <figure><img src="preview-src/2-alt-column-512.png" width="16" height="16" alt=""><figcaption>16</figcaption></figure>
      </div>

      </div>

      <div class="strip">

        <figure><img src="preview-src/5-pwa-192.png" width="32" height="32" alt=""><figcaption>32</figcaption></figure>
        <figure><img src="preview-src/5-pwa-192.png" width="16" height="16" alt=""><figcaption>16</figcaption></figure>

</div>
</html>
